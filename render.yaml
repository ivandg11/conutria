services:
  - type: web
    name: Conutria-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: node src/write-db-ca.js && (npx prisma migrate resolve --rolled-back 20261019120000_nutritionist_pdf_profile || npx prisma migrate status) && npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT_BASE64
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
